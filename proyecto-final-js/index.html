<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas de Libros | CA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="contenedor">
        <header class="cabecera">
            <h1><i class="fas fa-book-medical"></i> Seguimiento y Reseñas</h1>
            <p>Registra tus lecturas y apuntes</p>
        </header>

        <form id="formularioReseña" class="formulario">
            <input type="text" id="tituloLibro" placeholder="Ej. Análisis de Circuitos en Ingeniería" required>
            <textarea id="comentarioLibro" placeholder="Escribe tu comentario o apunte principal aquí..." rows="4" required></textarea>
            <button type="submit" id="btnAgregar"><i class="fas fa-plus"></i> Agregar Reseña</button>
        </form>

        <div id="listaReseñas" class="seccion-reseñas">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
